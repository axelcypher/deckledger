name: Build and publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: container-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build container image
    runs-on: ubuntu-latest
    outputs:
      published_image: ${{ steps.published_image.outputs.reference }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable image reference
        id: published_image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          echo "reference=${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        if: github.event_name != 'pull_request'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  update-deployment-repository:
    name: Update deployment image reference
    needs: build
    if: >-
      ${{
        github.event_name != 'pull_request' &&
        vars.DECKLEDGER_DEPLOY_REPOSITORY != '' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ vars.DECKLEDGER_DEPLOY_REPOSITORY }}
      TARGET_BRANCH: ${{ vars.DECKLEDGER_DEPLOY_BRANCH || 'main' }}
      TARGET_ENV_FILE: ${{ vars.DECKLEDGER_DEPLOY_ENV_FILE || '.env' }}
      TARGET_IMAGE_KEY: ${{ vars.DECKLEDGER_DEPLOY_IMAGE_KEY || 'DECKLEDGER_IMAGE' }}
      IMAGE_REFERENCE: ${{ needs.build.outputs.published_image }}

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.DECKLEDGER_DEPLOY_TOKEN }}
          path: deployment-repository

      - name: Update DeckLedger image in environment file
        working-directory: deployment-repository
        shell: bash
        run: |
          if [[ ! "$TARGET_IMAGE_KEY" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "Invalid environment variable name: $TARGET_IMAGE_KEY" >&2
            exit 1
          fi

          case "$TARGET_ENV_FILE" in
            ""|/*|../*|*/../*|*/..)
              echo "The environment file must be a safe repository-relative path." >&2
              exit 1
              ;;
          esac

          if [[ ! -f "$TARGET_ENV_FILE" ]]; then
            echo "Environment file not found: $TARGET_ENV_FILE" >&2
            exit 1
          fi

          temporary_file="$(mktemp)"
          awk -v key="$TARGET_IMAGE_KEY" -v value="$IMAGE_REFERENCE" '
            BEGIN { updated = 0 }
            $0 ~ "^" key "=" {
              if (!updated) print key "=" value
              updated = 1
              next
            }
            { print }
            END {
              if (!updated) print key "=" value
            }
          ' "$TARGET_ENV_FILE" > "$temporary_file"
          mv "$temporary_file" "$TARGET_ENV_FILE"

      - name: Commit and push deployment update
        working-directory: deployment-repository
        shell: bash
        run: |
          git add -- "$TARGET_ENV_FILE"
          if git diff --cached --quiet; then
            echo "Deployment repository already references $IMAGE_REFERENCE"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: deploy DeckLedger ${GITHUB_SHA::12}"
          git push origin "HEAD:$TARGET_BRANCH"
